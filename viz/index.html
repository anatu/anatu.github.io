<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects &mdash; Anand Natu</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .viz-search {
      width: 100%;
      padding: 10px 0;
      margin-bottom: 32px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .viz-search:focus {
      border-bottom-color: var(--color-text);
    }
    .viz-search::placeholder {
      color: var(--color-text-muted);
    }

    .viz-entry {
      margin-bottom: 28px;
    }
    .viz-entry:last-child {
      margin-bottom: 0;
    }
    .viz-entry__header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .viz-entry__title {
      font-size: 16px;
      font-weight: 600;
    }
    .viz-entry__title a {
      color: var(--color-text);
    }
    .viz-entry__date {
      font-size: 13px;
      color: var(--color-text-muted);
    }
    .viz-entry__tags {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }
    .viz-entry__desc {
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 1.7;
    }

    .viz-status {
      font-size: 14px;
      color: var(--color-text-muted);
      padding: 24px 0;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav__home">Anand Natu</a>
    <div class="nav__links">
      <a href="/#experience">Experience</a>
      <a href="/#education">Education</a>
      <a href="/#projects">Projects</a>
      <a href="/viz/">Projects</a>
    </div>
  </nav>

  <main class="container">

    <section id="viz" class="section">
      <h1 class="section__title section__title--hero">Projects</h1>
      <p class="section__subtitle">Interactive charts, diagrams, and analyses based on miscellaneous side projects.</p>

      <input
        type="text"
        id="viz-search"
        class="viz-search"
        placeholder="Search by title, description, or tag..."
        oninput="filterViz()"
        autocomplete="off"
      >

      <div id="viz-status" class="viz-status">Loading&hellip;</div>
      <div id="viz-list"></div>
    </section>

  </main>

  <footer class="footer">
    <p>&copy; 2026 Anand Natu</p>
  </footer>

  <script>
    let allDocs = [];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function loadManifest() {
      const status = document.getElementById('viz-status');
      try {
        const resp = await fetch('manifest.json', { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        allDocs = await resp.json();
        renderDocs(allDocs);
      } catch (e) {
        status.textContent = 'Failed to load manifest.json (' + e.message + ').';
      }
    }

    function renderDocs(docs) {
      const list = document.getElementById('viz-list');
      const status = document.getElementById('viz-status');

      if (allDocs.length === 0) {
        status.innerHTML = 'No visualizations published yet.';
        list.innerHTML = '';
        return;
      }
      if (docs.length === 0) {
        status.textContent = 'No matches.';
        list.innerHTML = '';
        return;
      }

      status.style.display = 'none';

      const sorted = [...docs].sort((a, b) =>
        (b.lastModified || '').localeCompare(a.lastModified || '')
      );

      list.innerHTML = sorted.map(doc => {
        const title = escapeHtml(doc.title || 'Untitled');
        const desc = escapeHtml(doc.description || '');
        const date = escapeHtml(doc.lastModified || '');
        const tags = (doc.tags || []).map(escapeHtml).join(' &middot; ');
        const href = escapeHtml(doc.file || '#');
        return `
          <article class="viz-entry">
            <div class="viz-entry__header">
              <h3 class="viz-entry__title"><a href="${href}">${title}</a></h3>
              ${date ? `<span class="viz-entry__date">${date}</span>` : ''}
            </div>
            ${tags ? `<p class="viz-entry__tags">${tags}</p>` : ''}
            ${desc ? `<p class="viz-entry__desc">${desc}</p>` : ''}
          </article>
        `;
      }).join('');
    }

    function filterViz() {
      const q = document.getElementById('viz-search').value.toLowerCase().trim();
      document.getElementById('viz-status').style.display = '';
      if (!q) { renderDocs(allDocs); return; }
      renderDocs(allDocs.filter(d => {
        const haystack = [
          d.title || '',
          d.description || '',
          (d.tags || []).join(' ')
        ].join(' ').toLowerCase();
        return haystack.includes(q);
      }));
    }

    loadManifest();
  </script>

</body>
</html>
