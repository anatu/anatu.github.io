<!DOCTYPE html>
<!--
  Template for a self-contained visualization page.

  To publish:
    1. Copy this file to viz/pages/<slug>.html (single-file viz)
       OR copy to viz/pages/<slug>/index.html (bundled report with sibling
       figures/, data/, sql/, scripts/ folders).
    2. Replace TITLE, DESCRIPTION, DATE, and the body content.
    3. Append an entry to viz/manifest.json:
       {
         "title": "...",
         "description": "...",
         "file": "pages/<slug>.html",
         "version": "1.0",
         "lastModified": "YYYY-MM-DD",
         "tags": ["..."]
       }
    4. git commit && git push.

  Styling note: this file inlines its own minimal CSS so the page is fully
  self-contained (works if downloaded, forked, or shared standalone). It
  intentionally mirrors the design tokens from /styles.css.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITLE &mdash; Anand Natu</title>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-text: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-muted: #999999;
      --color-border: #e5e5e5;
      --color-link: #1a1a1a;
      --color-link-hover: #666666;

      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-serif: Georgia, 'Times New Roman', serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

      --content-width: 720px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #161616;
        --color-text: #e5e5e5;
        --color-text-secondary: #a0a0a0;
        --color-text-muted: #707070;
        --color-border: #2a2a2a;
        --color-link: #e5e5e5;
        --color-link-hover: #a0a0a0;
      }
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.7;
      color: var(--color-text);
      background: var(--color-bg);
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 48px 24px;
      -webkit-font-smoothing: antialiased;
    }
    a {
      color: var(--color-link);
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      transition: color 0.15s ease;
    }
    a:hover { color: var(--color-link-hover); }

    h1 {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    h2 {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      margin: 40px 0 16px;
      padding-top: 24px;
      border-top: 1px solid var(--color-border);
    }
    p, li { margin-bottom: 12px; }
    ul, ol { padding-left: 20px; margin-bottom: 12px; }

    .meta {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: 32px;
    }
    .meta a { color: var(--color-text-muted); }

    figure {
      margin: 20px 0;
    }
    figure img {
      max-width: 100%;
      display: block;
      border: 1px solid var(--color-border);
      border-radius: 4px;
    }
    figcaption {
      font-size: 13px;
      color: var(--color-text-muted);
      margin-top: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--color-border);
      padding: 8px 12px;
      text-align: left;
    }
    th { color: var(--color-text-secondary); font-weight: 600; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }

    code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--color-border);
      padding: 1px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <h1>TITLE</h1>
  <div class="meta">
    YYYY-MM-DD &middot; <a href="../">&larr; back to viz</a>
  </div>

  <p>One-paragraph TL;DR of what this is and the takeaway.</p>

  <h2>Headline chart</h2>
  <figure>
    <!-- For bundled report (viz/pages/<slug>/index.html), use relative path: -->
    <!-- <img src="figures/chart.png" alt="..."> -->
    <img src="" alt="">
    <figcaption>Caption.</figcaption>
  </figure>

  <h2>Method</h2>
  <ol>
    <li>Step one.</li>
    <li>Step two.</li>
  </ol>

  <h2>Caveats</h2>
  <ul>
    <li>Note any limitations.</li>
  </ul>

</body>
</html>
